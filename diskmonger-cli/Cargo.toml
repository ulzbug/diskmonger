[package]
name = "diskmonger-cli"
version = "1.0.0-beta.1"
edition = "2021"

[dependencies]
diskmonger-core = { path = "../diskmonger-core" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.27.0", features = ["all-widgets"] }
crossterm = "0.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["std", "fileapi", "winnt", "minwindef"] }
