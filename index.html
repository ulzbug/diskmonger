<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="toolbar">
      <form class="row" id="scan-form" style="flex-grow: 1;">
        <span id="path-label"></span>
        <input id="scan-path-input" />
        <button type="button" id="browse-btn"></button>
        <button type="submit" id="scan-btn"></button>
      </form>
      <div class="row" style="margin-left: 20px;">
        <button type="button" id="toggle-free-space-btn" style="display: none;"></button>
        <button type="button" id="zoom-out-btn"></button>
        <button type="button" id="reset-zoom-btn"></button>
      </div>
    </div>
    <div id="treemap-container">
      <canvas id="treemap-canvas"></canvas>
      <div id="treemap-tooltip"></div>
      <button type="button" id="cancel-scan-btn"></button>
    </div>
  </body>
</html>
